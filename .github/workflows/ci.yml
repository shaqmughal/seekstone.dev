name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Retired marketing claims must not resurface in prose (structured
      # figures come from src/data/benchmarks.json and cannot drift).
      - run: npm run check:phrases
      # src/data/benchmarks.json must match the seekstone repo's canonical
      # copy. Network — GitHub Actions only, never part of `npm run build`
      # (the Vercel build must not depend on it).
      - run: npm run check:benchmarks
